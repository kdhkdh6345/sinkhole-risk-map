<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python ↔ JS Parity 검증</title>
  <style>
    body { font-family: system-ui, 'Noto Sans KR', sans-serif; margin: 24px; background: #0d1117; color: #e6edf3; }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #30363d; padding: 4px 8px; text-align: right; }
    th { background: #161b22; }
    .ok { color: #3fb950; } .fail { color: #f85149; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Python ↔ JS 엔진 일치 검증</h2>
  <p id="summary">계산 중…</p>
  <table id="tbl"><thead><tr>
    <th>케이스</th><th>경과(h)</th><th>Python 점수</th><th>JS 점수</th><th>차이</th>
    <th>Python 단계</th><th>JS 단계</th><th>이상탐지 Py/JS</th><th>결과</th>
  </tr></thead><tbody></tbody></table>
  <script src="js/sim.js"></script>
  <script>
    (async () => {
      const get = (u) => fetch(u + '?t=' + Date.now()).then(r => r.json());
      const [parity, gridCfg, weightsCfg] = await Promise.all([
        get('data/parity.json'), get('data/grid_cfg.json'), get('data/weights_cfg.json')
      ]);
      const res = SinkholeEngine.validateParity(parity.cases, gridCfg, weightsCfg);
      const tbody = document.querySelector('#tbl tbody');
      for (const r of res) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align:left">${r.case}</td><td>${r.elapsed_h}</td>
          <td>${r.py_score.toFixed(4)}</td><td>${r.js_score.toFixed(4)}</td><td>${r.score_diff.toFixed(6)}</td>
          <td>${r.py_stage}</td><td>${r.js_stage}</td><td>${r.py_anomaly}/${r.js_anomaly}</td>
          <td class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✅' : '❌'}</td>`;
        tbody.appendChild(tr);
      }
      const pass = res.filter(r => r.ok).length;
      const el = document.getElementById('summary');
      el.textContent = `${pass}/${res.length} 통과`;
      el.className = pass === res.length ? 'ok' : 'fail';
    })();
  </script>
</body>
</html>
