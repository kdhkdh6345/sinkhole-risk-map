# 배점·임계값·단계판정 규칙
#
# AGENTS.md 2절 3항: "배점·임계값을 코드에 숫자로 박지 않는다."
# 이 파일의 값 외에는 어떤 점수도 코드에 등장해서는 안 된다.
# 근거 출처: AGENTS.md 6절 "점수 설계"

# ============================================================
# 정적 기저점수 B (합: 0~60)
# ============================================================
static:
  # 하수관 노후도·누수 (자치구별 노후 비율 min-max 정규화)
  sewer:
    max: 20

  # 시추공 지층 / N값 (N값 역수 + 매립층 여부)
  borehole:
    max: 15

  # 과거 침하·공동 이력 (반경 내 건수 × 최근성 감쇠)
  history:
    max: 15

  # 액상화 위험등급 (상/중/하 매핑)
  liquefaction:
    max: 10
    values:
      high:   1.0
      medium: 0.6
      low:    0.2

# ============================================================
# 실시간 가중치 R/G/T (합: 0~40)
# ============================================================
realtime:
  # 강수 R (0~25) — 기상청 특보 기준
  # 근거: 기상청 호우특보 발령 기준 (기상법 시행령)
  rain:
    max: 25
    thresholds:
      # 낮은 점수부터 순서대로 나열 (마지막으로 매칭되는 구간 적용)
      - name: precaution
        score: 10
        conditions:
          any:
            - {window_h: 1, mm: 20}   # 1h >= 20mm
            - {window_h: 3, mm: 40}   # 3h >= 40mm
      - name: advisory
        score: 15
        conditions:
          any:
            - {window_h: 3,  mm: 60}  # 3h >= 60mm
            - {window_h: 12, mm: 110} # 12h >= 110mm
      - name: warning
        score: 20
        conditions:
          any:
            - {window_h: 3,  mm: 90}  # 3h >= 90mm
            - {window_h: 12, mm: 180} # 12h >= 180mm
      - name: extreme
        score: 25
        conditions:
          any:
            - all:
                - {window_h: 1, mm: 50}
                - {window_h: 3, mm: 90}
            - {window_h: 1, mm: 72}   # 1h >= 72mm

  # 지하수위 G (0~10)
  groundwater:
    max: 10
    sigma1_score: 5   # 1σ 이상 급락 시 가점
    sigma2_score: 10  # 2σ 이상 급락 시 가점
    # 조건: R >= min_rain 일 때만 인정 (강수 없는 단독 변동 배제)
    min_rain_for_g: 15
    # 조건: 연속 관측 횟수 충족해야 인정 (센서 오류 필터)
    consecutive_obs: 2

  # 교통 T (0~5) — Phase 3까지 정적 프록시 사용
  traffic:
    max: 5
    # 실시간 교통 (서울 실시간 도시데이터 도로소통). 서울시 소통 등급을 정체 저하율로 매핑.
    congestion:
      원활: 0.0
      서행: 0.5
      정체: 1.0
    refresh_minutes: 30     # 도시데이터는 120여 장소를 각각 호출하므로 30분마다만 새로 받는다
    link_radius_deg: 0.005  # 격자 중심에서 이 반경(약 500m) 안의 도로 링크만 평균

# ============================================================
# 단계 판정 임계값
# ============================================================
# 근거: AGENTS.md 6절 "단계 판정"
# B >= 30은 잠정값. 전체 격자 점수 분포로 튜닝 후 docs/tuning.md에 기록.
stages:
  stage1:
    b_min: 10           # 잠정값. Phase 2 현재 하수관만 구현(max 20)이므로 10으로 조정.
                        # 전체 4개 레이어 완성 후 백분위 기준으로 재튜닝. docs/tuning.md 참고.
  stage2:
    r_min: 15           # stage1 AND R >= 15
  stage3:
    g_min: 8.0           # stage2 AND G >= 8.0

# ============================================================
# 융합 (Phase 7-1) — 채널별 측정 분산 σ²
# ============================================================
# 근거: docs/fusion_eval.md 2-2절. 가중치 w_i = 1/σ_i².
# Python(fusion/bayes.py)과 브라우저(web/js/sim.js)가 모두 이 값을 읽는다.
fusion:
  variances:
    b: 4.0
    r: 9.0
    g: 25.0
    t: 36.0

# ============================================================
# 이상탐지 (Phase 7-2)
# ============================================================
# 지하수위 σ 이상도의 절댓값이 이 값을 넘으면 ai_anomaly = true.
anomaly:
  sigma_threshold: 2.5
