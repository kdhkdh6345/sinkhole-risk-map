name: Update Real-time Risk Snapshot

on:
  schedule:
    - cron: '* * * * *' # Run every minute
  workflow_dispatch: # Allow manual trigger

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Generate new snapshot
      run: |
        # Generate the latest snapshot for all scenarios
        python scripts/run_snapshot.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add web/data/snapshot*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update snapshot data" && git push)

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web
        publish_branch: gh-pages
